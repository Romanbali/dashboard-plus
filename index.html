<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<meta name="google" content="notranslate">

<title>November 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#022b80}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#f4f7ff;overflow-x:hidden}
.stage{touch-action:pan-y;width:min(100vw,1024px);aspect-ratio:2/3;position:relative;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#022b80 0%,#03358f 34%,#0347ad 67%,#086cfa 100%)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 85% 45% at 50% 31%,rgba(0,85,210,.24),transparent 76%),radial-gradient(ellipse 90% 52% at 52% 100%,rgba(0,119,255,.26),transparent 80%);pointer-events:none}
.month{position:absolute;top:0.55%;left:0;width:100%;text-align:center;font-size:clamp(22px,6.25vw,64px);font-weight:300;letter-spacing:.01em;line-height:1.2;white-space:nowrap;color:#f5f5fc}
.chart{position:absolute;left:2.7%;top:12.65%;width:94.6%;height:15.5%;overflow:visible}
.chart svg{width:100%;height:100%;overflow:visible}
.glow{fill:none;stroke:#12eaff;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;opacity:.7;filter:url(#blur)}
.line{fill:none;stroke:#21eaff;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#lineGlow)}
.future{fill:none;stroke:rgba(244,248,255,.94);stroke-width:3;stroke-linecap:round;stroke-dasharray:.1 7.2}
.forecast-marker{fill:rgba(244,248,255,.72);stroke:rgba(244,248,255,.24);stroke-width:1.5}
.negative-point-halo{fill:#ff78c6;opacity:.48;filter:url(#negativePointBlur)}
.negative-point{fill:#ffd0e9;opacity:1;stroke:#ff70bd;stroke-width:1;filter:url(#negativePointGlow)}

.forecast-value{position:absolute;left:76%;top:10%;width:auto;height:auto;min-height:0;padding:0 2px;border-radius:0;background:transparent;border:0;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,2.5vw,25px);font-weight:400;color:rgba(239,246,255,.72);letter-spacing:.01em;z-index:3;box-shadow:none;white-space:nowrap;pointer-events:none}
.marker-line{stroke:rgba(242,247,255,.78);stroke-width:1.5}
.marker-halo{fill:#fff;opacity:.42;filter:url(#blur)}
.marker{fill:#fff}
.pill{position:absolute;left:51.85%;top:9.22%;width:15.15%;height:3.15%;min-height:22px;border-radius:7px;background:rgba(184,210,247,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.15vw,32px);font-weight:400;color:#fff;letter-spacing:.01em;z-index:2}
.pill{border:0;cursor:pointer;font-family:inherit;padding:0}
.pill:active{filter:brightness(1.12)}
.deposit-backdrop{position:fixed;left:0;right:0;top:var(--visible-top,0px);height:var(--visible-height,100dvh);bottom:auto;z-index:20;display:none;align-items:center;justify-content:center;padding:12px 16px;background:rgba(0,13,49,.62);backdrop-filter:blur(8px);overflow:hidden;overscroll-behavior:contain}
.deposit-backdrop.open{display:flex}
.deposit-dialog{width:min(100%,360px);max-height:calc(var(--visible-height, 100dvh) - 24px);overflow-y:auto;overscroll-behavior:contain;padding:24px 24px 0;border:1px solid rgba(210,230,255,.2);border-radius:22px;background:linear-gradient(155deg,#174d9d,#07327e);box-shadow:0 18px 60px rgba(0,0,0,.38);color:#f5f8ff;flex:0 0 auto;scrollbar-width:none}
@supports not (height:100dvh){.deposit-dialog{max-height:calc(var(--visible-height, 100vh) - 32px)}}
.deposit-dialog h2{margin:0 0 7px;font-size:21px;font-weight:500}
.deposit-dialog p{margin:0 0 18px;color:rgba(235,244,255,.72);font-size:14px;line-height:1.4}
.deposit-dialog label{display:block;margin-bottom:7px;font-size:13px;color:rgba(235,244,255,.82)}
.deposit-dialog input{width:100%;height:52px;padding:0 14px;border:1px solid rgba(220,237,255,.28);border-radius:12px;outline:none;background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-size:22px;font-weight:500}
.deposit-dialog input:focus{border-color:#59eaff;box-shadow:0 0 0 3px rgba(40,220,255,.14)}
.selection-editor{display:none;margin:0 0 18px;padding:13px;border:1px solid rgba(210,230,255,.15);border-radius:14px;background:rgba(255,255,255,.055)}
.deposit-dialog.date-selection-active .selection-editor{display:block}
.deposit-dialog.date-selection-active>label[for="depositInput"],
.deposit-dialog.date-selection-active>#depositInput{display:none}
.deposit-dialog.date-selection-active .selection-editor>label[for="periodAmount"]{display:block}

.selection-date-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selection-date-fields input{height:42px;font-size:17px}
.selection-editor>label{margin-top:10px}
.selection-editor input[readonly]{height:42px;font-size:17px;opacity:.9}
.selection-clear{display:block;margin:10px 0 0 auto;padding:5px 0;border:0;background:transparent;color:#9feeff;font:inherit;font-size:13px}
.day.in-range{background:linear-gradient(145deg,rgba(255,105,190,.25),rgba(190,91,210,.17));border-color:rgba(255,145,211,.42);box-shadow:inset 0 0 12px rgba(255,105,190,.13)}
.day.range-start,.day.range-end{border:1.5px solid rgba(255,125,202,.95);background:linear-gradient(145deg,rgba(255,91,181,.34),rgba(176,91,220,.24));box-shadow:0 0 10px rgba(255,83,180,.38),0 0 18px rgba(255,83,180,.18),inset 0 0 10px rgba(255,125,202,.18)}
.day.range-start{border-radius:calc(min(100vw,1024px)*.0234) 5px 5px calc(min(100vw,1024px)*.0234)}
.day.range-end{border-radius:5px calc(min(100vw,1024px)*.0234) calc(min(100vw,1024px)*.0234) 5px}
.deposit-actions{position:sticky;bottom:0;display:flex;gap:10px;margin:18px -24px 0;padding:12px 24px 24px;background:linear-gradient(180deg,rgba(12,57,133,.9),#123f8d 30%);}
.deposit-actions button{flex:1;min-height:44px;border:1px solid rgba(230,240,255,.2);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-family:inherit;font-size:15px;font-weight:500}
.deposit-actions .save{border:0;background:linear-gradient(100deg,#13c9ed,#397aff);color:#fff}
.edit-selection-button{position:absolute;left:50%;top:34.2%;transform:translateX(-50%) translateY(-6px);display:none;align-items:center;gap:10px;min-height:44px;padding:0 17px;border:1px solid rgba(117,238,255,.55);border-radius:999px;background:linear-gradient(115deg,rgba(13,190,230,.27),rgba(47,111,255,.42));box-shadow:0 0 18px rgba(25,196,255,.2),inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(0,20,80,.2);backdrop-filter:blur(12px);color:#f5fbff;font-family:inherit;font-size:clamp(13px,3.4vw,16px);font-weight:500;line-height:1;letter-spacing:.01em;white-space:nowrap;cursor:pointer;transition:opacity .2s,transform .2s}
.stage.date-selection-active .edit-selection-button{display:flex;transform:translateX(-50%) translateY(0)}
.edit-selection-icon{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:rgba(111,235,255,.17);color:#a9f5ff;font-size:17px}
.edit-selection-arrow{margin-left:2px;color:rgba(205,245,255,.8);font-size:15px}
.edit-selection-button:active{transform:translateX(-50%) scale(.97)}
.days-window{position:absolute;left:7.32%;top:24.8%;width:89.36%;height:8.25%;overflow-x:auto;overflow-y:visible;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.days-window::-webkit-scrollbar{display:none}
.days{height:100%;display:flex;gap:calc(min(100vw,1024px)*.0127);width:max-content;min-width:100%;padding:0 0 3px}
.day{flex:0 0 calc(min(100vw,1024px)*.1006);width:calc(min(100vw,1024px)*.1006);height:100%;border:1px solid rgba(206,224,255,.09);border-radius:calc(min(100vw,1024px)*.0234);background:linear-gradient(145deg,rgba(255,255,255,.135),rgba(255,255,255,.065));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 7px 19px rgba(0,20,75,.13);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:13px;gap:11px;color:#f5f7ff;cursor:pointer;user-select:none;position:relative;white-space:nowrap}
.day .weekday{font-size:clamp(11px,2.35vw,24px);font-weight:400;line-height:1.1;color:#edf3ff}
.day .date{font-size:clamp(17px,4.05vw,41px);line-height:1.05;font-weight:600;letter-spacing:-.025em}
.day .amount{font-size:clamp(9px,1.65vw,16px);line-height:1;font-weight:500;letter-spacing:.01em;margin-top:-5px;color:rgba(215,244,255,.86);text-shadow:0 0 7px rgba(76,220,255,.16)}
.day .amount.negative{color:rgba(255,190,220,.94);text-shadow:0 0 7px rgba(255,95,189,.18)}
.day.selected .amount{color:#f5fbff;text-shadow:0 0 8px rgba(85,226,255,.3)}
.day.selected .amount.negative{color:#ffd4eb;text-shadow:0 0 8px rgba(255,95,189,.3)}
.day.dim .amount{color:rgba(180,204,239,.34);text-shadow:none}
.day.selected{border:2px solid #ff5fbd;box-shadow:0 0 5px 1px #ff55b9,0 0 15px 2px rgba(255,69,181,.82),inset 0 0 8px rgba(255,89,192,.16);padding-top:12px}
.day.dim,.day.future{background:rgba(255,255,255,.045);border-color:rgba(190,215,255,.035);box-shadow:none}
.day.dim .weekday,.day.dim .date,.day.future .weekday,.day.future .date{color:rgba(180,204,239,.42)}
@media(max-width:600px){.day{border-radius:clamp(9px,2.35vw,24px);padding-top:1.25vw;gap:1.05vw}.day.selected{padding-top:1.1vw}}

/* Strong range tint: keep the pink selection visible over default/future day styles. */
.stage.date-selection-active .days .day.in-range,
.stage.date-selection-active .days .day.range-start,
.stage.date-selection-active .days .day.range-end{
  background:linear-gradient(145deg,rgba(255,105,190,.34),rgba(190,91,210,.25)) !important;
  border-color:rgba(255,145,211,.88) !important;
  box-shadow:inset 0 0 14px rgba(255,105,190,.18),0 0 9px rgba(255,83,180,.22) !important;
}
.stage.date-selection-active .days .day.range-start,
.stage.date-selection-active .days .day.range-end{
  border:1.5px solid rgba(255,125,202,.98) !important;
  box-shadow:inset 0 0 13px rgba(255,125,202,.22),0 0 11px rgba(255,83,180,.42),0 0 20px rgba(255,83,180,.2) !important;
}

.month-navigation{position:absolute;top:.55%;left:0;width:100%;height:5.5%;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}
.month-navigation .month{position:relative;top:auto;left:auto;width:auto;margin:0;pointer-events:none}
.month-arrow{pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);width:clamp(34px,8vw,58px);height:clamp(34px,8vw,58px);border:1px solid rgba(205,229,255,.18);border-radius:50%;background:rgba(180,211,255,.09);color:rgba(239,248,255,.8);font:300 clamp(25px,6vw,42px)/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.month-arrow:active{background:rgba(44,211,255,.2);border-color:rgba(60,224,255,.6);transform:translateY(-50%) scale(.94)}
.month-arrow:disabled{opacity:.22;cursor:default;pointer-events:none;box-shadow:none}
#previousMonth{left:4%}#nextMonth{right:4%}
@media(min-width:700px){#previousMonth{left:12%}#nextMonth{right:12%}}

/* Daily habit cards */
.habits{position:absolute;left:2.8%;top:42.7%;width:94.4%;display:grid;grid-template-columns:1fr 1fr;gap:2.2%;z-index:2}
.habit-card{min-width:0;height:10.7%;min-height:0;aspect-ratio:1.95/1;padding:3.2% 4.2% 2.5%;border:1px solid rgba(211,231,255,.25);border-radius:calc(min(100vw,1024px)*.026);background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 7px 20px rgba(0,18,68,.12);color:#f5f8ff;font-family:inherit;text-align:left;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:border-color .18s,background .18s,box-shadow .18s}
.habit-main{display:flex;align-items:center;min-width:0;gap:3.5%}
.habit-icon{flex:0 0 19%;width:19%;height:auto;max-height:clamp(28px,7.5vw,72px);object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2))}
.habit-copy{min-width:0;flex:1}
.habit-name{font-size:clamp(12px,3.2vw,28px);font-weight:650;line-height:1.05;letter-spacing:.005em;white-space:nowrap}
.habit-subtitle{margin-top:4px;font-size:clamp(8px,1.8vw,15px);line-height:1.1;color:rgba(239,246,255,.86);white-space:nowrap}
.habit-toggle{flex:0 0 clamp(28px,9.6vw,66px);width:clamp(28px,9.6vw,66px);height:clamp(28px,5.2vw,42px);border-radius:999px;background:rgba(188,218,255,.19);display:grid;place-items:center;color:rgba(242,248,255,.9);font-size:clamp(17px,4vw,30px);font-weight:500;line-height:1}
.habit-stats{display:flex;align-items:center;justify-content:space-between;gap:5px;padding-top:5%;border-top:1px solid rgba(220,237,255,.14);font-size:clamp(7px,1.65vw,14px);font-weight:550;color:rgba(237,245,255,.88);white-space:nowrap}
.habit-stat{display:flex;align-items:center;gap:4px;min-width:0}
.habit-stat-icon{font-size:1.12em;opacity:.9}
.habit-card.done{border-color:rgba(119,238,255,.65);background:linear-gradient(145deg,rgba(50,193,235,.2),rgba(255,255,255,.065));box-shadow:0 0 13px rgba(55,210,255,.13),inset 0 0 14px rgba(74,220,255,.08)}
.habit-card.done .habit-toggle{background:rgba(86,220,255,.28);color:#d9fbff;box-shadow:0 0 12px rgba(62,219,255,.22)}
.habit-card:active{filter:brightness(1.15);transform:scale(.99)}
@media(max-width:380px){.habits{gap:1.8%}.habit-card{padding-left:3%;padding-right:3%}.habit-name{font-size:clamp(11px,3vw,15px)}.habit-subtitle{font-size:clamp(7px,1.7vw,9px)}.habit-stats{font-size:clamp(6px,1.55vw,8px)}}

</style>
</head>
<body translate="no" class="notranslate">
<main class="stage" aria-label="Monthly earnings dashboard">
  <div class="month-navigation" aria-label="Month navigation">
    <button class="month-arrow" id="previousMonth" type="button" aria-label="Previous month">‹</button>
    <h1 class="month" id="monthTitle">November 2026</h1>
    <button class="month-arrow" id="nextMonth" type="button" aria-label="Next month">›</button>
  </div>
  <div class="chart">
    <svg viewBox="0 0 960 240" preserveAspectRatio="none" role="img" aria-label="Smooth monthly earnings curve">
      <defs>
        <filter id="blur" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="lineGlow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="negativePointBlur" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="5"/></filter><filter id="negativePointGlow" x="-250%" y="-250%" width="600%" height="600%"><feGaussianBlur stdDeviation="1.5"/></filter>
      </defs>
      <path class="glow" d="M0 146 C55 110 68 70 150 70 C230 70 255 150 335 157 C415 165 430 105 500 94 C550 86 570 107 610 95 C675 78 710 38 788 22"/>
      <path class="line" id="activeLine" d="M0 146 C55 110 68 70 150 70 C230 70 255 150 335 157 C415 165 430 105 500 94 C550 86 570 107 610 95 C675 78 710 38 788 22"/>
      <path class="future" d="M788 22 C824 19 836 61 870 58 C900 55 913 75 930 83 C941 88 950 86 960 87"/>
      
      <circle class="marker-halo" cx="580" cy="30" r="19"/>
      <circle class="marker" cx="580" cy="30" r="8.5"/>
      <g id="negativePoints" aria-hidden="true"></g><circle class="forecast-marker" id="forecastMarker" cx="940" cy="87" r="5"/>
    </svg>
  </div>
  <button class="pill" id="value" type="button" aria-label="Edit starting deposit" title="Edit starting deposit">$123</button>
  <div class="forecast-value" id="forecastValue" aria-label="Projected month-end balance">≈ $0</div>
  <div class="days-window" id="daysWindow" aria-label="Scroll dates horizontally">
    <div class="days" id="days"></div>
  </div>
  <button class="edit-selection-button" id="editSelectionButton" type="button">
    <span class="edit-selection-icon" aria-hidden="true">✎</span>
    <span>Редактировать</span>
    <span class="edit-selection-arrow" aria-hidden="true">↗</span>
  </button>
</main>
<section class="habits" aria-label="Ежедневные привычки">
  <button class="habit-card" id="coffeeHabit" type="button" aria-pressed="false">
    <span class="habit-main">
      <span class="habit-icon" aria-hidden="true" style="font-size:clamp(27px,6.7vw,58px);line-height:1">🥤</span>
      <span class="habit-copy"><span class="habit-name">КОФЕ</span><span class="habit-subtitle">Maximum 1 cup per day</span></span>
      <span class="habit-toggle" aria-hidden="true">◉</span>
    </span>
    <span class="habit-stats"><span class="habit-stat"><span class="habit-stat-icon">▢</span><span data-streak="coffee">0 дней подряд</span></span><span class="habit-stat"><span class="habit-stat-icon">🏆</span><span data-record="coffee">Рекорд 0 дней</span></span></span>
  </button>
  <button class="habit-card" id="pushupHabit" type="button" aria-pressed="false">
    <span class="habit-main">
      <svg class="habit-icon" viewBox="0 0 72 48" aria-hidden="true"><path d="M5 27l13-5 13-2 8-7 8-2 4 4-7 7 11 2 10-7 5 3-8 13-17 1-10-5-14 7-13-2z" fill="#f4f8ff"/><path d="M18 22l-7 11M50 12l8-7" stroke="#f4f8ff" stroke-width="4" stroke-linecap="round"/><circle cx="65" cy="7" r="4" fill="#f4f8ff"/></svg>
      <span class="habit-copy"><span class="habit-name">ОТЖИМАНИЕ</span><span class="habit-subtitle">Каждый день</span></span>
      <span class="habit-toggle" aria-hidden="true">✓</span>
    </span>
    <span class="habit-stats"><span class="habit-stat"><span class="habit-stat-icon">▢</span><span data-streak="pushup">0 дней подряд</span></span><span class="habit-stat"><span class="habit-stat-icon">🏆</span><span data-record="pushup">Рекорд 0 дней</span></span></span>
  </button>
</section>
<div class="deposit-backdrop" id="depositBackdrop" aria-hidden="true">
  <section class="deposit-dialog" role="dialog" aria-modal="true" aria-labelledby="depositTitle">
    <h2 id="depositTitle">Edit balance</h2>
    <p id="depositDescription">Set the deposit balance for the selected day. This day's result and all following balances will recalculate automatically.</p>
    <div class="selection-editor">
      <div class="selection-date-fields">
        <div><label for="rangeStartDate">Start date</label><input id="rangeStartDate" type="number" inputmode="numeric" min="1" max="30" placeholder="Day"></div>
        <div><label for="rangeEndDate">End date</label><input id="rangeEndDate" type="number" inputmode="numeric" min="1" max="30" placeholder="Day"></div>
      </div>
      <label for="periodAmount">Amount per day for selected dates ($)</label>
      <input id="periodAmount" type="number" inputmode="decimal" step="0.01" autocomplete="off" value="0">
      <button type="button" class="selection-clear" id="clearDateSelection">Clear selection</button>
    </div>
    <label for="depositInput">Balance on selected day ($)</label>
    <input id="depositInput" type="number" inputmode="decimal" step="0.01" autocomplete="off">
    <div class="deposit-actions">
      <button type="button" id="cancelDeposit">Cancel</button>
      <button type="button" class="save" id="saveDeposit">Save</button>
    </div>
  </section>
</div>
<script>

const habitStoreKey='dashboardPlusHabits';
let habitData={};
try{habitData=JSON.parse(localStorage.getItem(habitStoreKey)||'{}')||{};}catch(error){habitData={};}
const habitIds=['coffee','pushup'];
const habitDateKey=(date)=>date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
function habitStats(id){
  const today=new Date();
  const todayKey=habitDateKey(today);
  let streak=0;
  const cursor=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  while(habitData[habitDateKey(cursor)]&&habitData[habitDateKey(cursor)][id]){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  let best=0,run=0,previous=null;
  const dates=Object.keys(habitData).filter(key=>habitData[key]&&habitData[key][id]).sort();
  for(const key of dates){
    const d=new Date(key+'T12:00:00');
    if(previous){const diff=Math.round((d-previous)/86400000);run=diff===1?run+1:1;}else run=1;
    best=Math.max(best,run);previous=d;
  }
  return {done:!!(habitData[todayKey]&&habitData[todayKey][id]),streak,best};
}
function renderHabits(){
  const todayKey=habitDateKey(new Date());
  habitIds.forEach(id=>{
    const button=document.getElementById(id==='coffee'?'coffeeHabit':'pushupHabit');
    const stats=habitStats(id);
    button.classList.toggle('done',stats.done);
    button.setAttribute('aria-pressed',String(stats.done));

function monthKey(year=viewYear,month=viewMonth){return 'dashboardPlusDailyAmounts-'+year+'-'+String(month+1).padStart(2,'0');}

function loadMonthData(){
  const count=daysInViewMonth();
  const key=monthKey();
  try{
    const stored=localStorage.getItem(key);
    const hasUserEdits=localStorage.getItem(key+'-edited')==='1';
    if(stored&&hasUserEdits){
      const parsed=JSON.parse(stored);
      amounts=Array.isArray(parsed)&&parsed.length===count&&parsed.every(n=>Number.isFinite(n))?parsed:Array(count).fill(0);
    }else if(viewYear===2026&&viewMonth===10){
      const legacy=JSON.parse(localStorage.getItem('dashboardPlusDailyAmounts')||'null');
      amounts=Array.isArray(legacy)&&legacy.length===count&&legacy.every(n=>Number.isFinite(n))?legacy:novemberSeed.slice(0,count);
    }else amounts=Array(count).fill(0);
  }catch(error){amounts=(viewYear===2026&&viewMonth===10?novemberSeed.slice(0,count):Array(count).fill(0));}
  todayDate=isCurrentViewMonth()?new Date().getDate():(new Date(viewYear,viewMonth,1)<new Date(new Date().getFullYear(),new Date().getMonth(),1)?count:1);
  todayIndex=Math.max(0,Math.min(count-1,todayDate-1));

function storedMonthAmounts(year,month){
  const count=new Date(year,month+1,0).getDate();
  const key=monthKey(year,month);
  try{
    const stored=localStorage.getItem(key);
    if(stored&&localStorage.getItem(key+'-edited')==='1'){
      const parsed=JSON.parse(stored);
      if(Array.isArray(parsed)&&parsed.length===count&&parsed.every(Number.isFinite)) return parsed;
    }
    if(year===2026&&month===10){
      const legacy=JSON.parse(localStorage.getItem('dashboardPlusDailyAmounts')||'null');
      if(Array.isArray(legacy)&&legacy.length===count&&legacy.every(Number.isFinite)) return legacy;
      return novemberSeed.slice(0,count);
    }
  }catch(error){}
  return Array(count).fill(0);
}
function monthOpeningBalance(year,month){
  const key=monthKey(year,month)+'-openingOverride';
  try{
    const override=localStorage.getItem(key);
    if(override!==null&&Number.isFinite(Number(override))) return Number(override);
  }catch(error){}
  const firstMonth=new Date(2026,9,1);
  const currentMonth=new Date(year,month,1);
  let baseDeposit=200;
  try{
    const savedBase=localStorage.getItem('dashboardPlusBaseDeposit');
    if(savedBase!==null&&Number.isFinite(Number(savedBase))) baseDeposit=Number(savedBase);
    else{
      const legacyBase=localStorage.getItem('dashboardPlusStartingDeposit');
      if(legacyBase!==null&&Number.isFinite(Number(legacyBase))) baseDeposit=Number(legacyBase);
      localStorage.setItem('dashboardPlusBaseDeposit',String(baseDeposit));
    }
  }catch(error){}
  if(currentMonth<=firstMonth) return baseDeposit;
  const previousMonth=new Date(year,month-1,1);
  const previousOpening=monthOpeningBalance(previousMonth.getFullYear(),previousMonth.getMonth());
  const previousAmounts=storedMonthAmounts(previousMonth.getFullYear(),previousMonth.getMonth());
  return Math.round((previousOpening+previousAmounts.reduce((sum,amount)=>sum+amount,0))*100)/100;
}

function chartPoints(){
  const balances=[startingDeposit];
  amounts.forEach((change,index)=>{
    const nextBalance=balances[index]+change;
    balances.push(Math.round(nextBalance*100)/100);
  });
  const min=Math.min(...balances);
  const max=Math.max(...balances);
  const range=max-min||1;
  const visualRange=range*1.22;
  const center=(max+min)/2;
  return balances.map((balance,index)=>({
    x:20+920*index/(balances.length-1),
    y:90-70*(balance-center)/visualRange,
    balance
  }));
}

function curvePath(points,from,to){
  if(from>to) return '';
  if(from===to) return 'M '+points[from].x+' '+points[from].y;
  let d='M '+points[from].x+' '+points[from].y;
  // Centripetal-style cubic handles create a continuous, flowing line through every daily balance.
  for(let i=from;i<to;i++){
    const p0=points[Math.max(from,i-1)];
    const p1=points[i];
    const p2=points[i+1];
    const p3=points[Math.min(to,i+2)];
    const dx=p2.x-p1.x;
    const tension=0.34;
    const c1x=p1.x+dx/3;
    const c2x=p2.x-dx/3;
    const c1y=p1.y+(p2.y-p0.y)*tension;
    const c2y=p2.y-(p3.y-p1.y)*tension;
    d+=' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y;
  }
  return d;
}

  if(depositBackdrop.classList.contains('open')) return;
  const nextMonthDate=new Date(viewYear,viewMonth+offset,1);
  if(nextMonthDate<earliestCalendarMonth) return;
  viewYear=nextMonthDate.getFullYear();
  viewMonth=nextMonthDate.getMonth();
  loadMonthData();
  startingDeposit=monthOpeningBalance(viewYear,viewMonth);
  selectedDay=todayIndex;
  rangeStartIndex=todayIndex;rangeEndIndex=todayIndex;
  rangeMode=false;hasUserDateSelection=false;dateSelectionCleared=false;dateSelectionActive=false;
  document.querySelector('.stage').classList.remove('date-selection-active');
  days.innerHTML='';
  document.getElementById('monthTitle').textContent=monthLabel();
  const previousMonthButton=document.getElementById('previousMonth');
  previousMonthButton.disabled=(viewYear===2026&&viewMonth===9);
  previousMonthButton.setAttribute('aria-disabled',String(previousMonthButton.disabled));
  buildMonthDays();
  syncEditorDateFields();
  scrollCalendarToToday(false);
}
document.getElementById('previousMonth').addEventListener('click',()=>changeMonth(-1));
document.getElementById('nextMonth').addEventListener('click',()=>changeMonth(1));
// Horizontal swipe anywhere on the dashboard (except the date strip) changes month.
let monthSwipeStart=null;
const stageForSwipe=document.querySelector('.stage');
stageForSwipe.addEventListener('touchstart',event=>{
  if(depositBackdrop.classList.contains('open')||event.target.closest('.days-window,.edit-selection-button,.month-arrow')){monthSwipeStart=null;return;}
  const touch=event.changedTouches[0];monthSwipeStart={x:touch.clientX,y:touch.clientY};
},{passive:true});
stageForSwipe.addEventListener('touchend',event=>{
  if(!monthSwipeStart)return;
  const touch=event.changedTouches[0],dx=touch.clientX-monthSwipeStart.x,dy=touch.clientY-monthSwipeStart.y;
  monthSwipeStart=null;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25) changeMonth(dx>0?-1:1);
},{passive:true});
let mouseSwipeStart=null;
stageForSwipe.addEventListener('pointerdown',event=>{
  if(event.pointerType!=='mouse'||event.target.closest('.days-window,.edit-selection-button,.month-arrow'))return;
  mouseSwipeStart={x:event.clientX,y:event.clientY};
});
stageForSwipe.addEventListener('pointerup',event=>{
  if(!mouseSwipeStart)return;
  const dx=event.clientX-mouseSwipeStart.x,dy=event.clientY-mouseSwipeStart.y;mouseSwipeStart=null;
  if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)changeMonth(dx>0?-1:1);
});

rangeStartDateInput.addEventListener('input',updateSelectionFromEditor);
rangeEndDateInput.addEventListener('input',updateSelectionFromEditor);
clearDateSelectionButton.addEventListener('click',()=>{
  dateSelectionActive=false;
  document.querySelector('.stage').classList.remove('date-selection-active');
  document.querySelector('.deposit-dialog').classList.remove('date-selection-active');
  rangeStartIndex=null;
  rangeEndIndex=null;
  rangeMode=false;
  hasUserDateSelection=false;
  dateSelectionCleared=true;
  renderDateSelection();
  rangeStartDateInput.value='';
  rangeEndDateInput.value='';
  periodAmountInput.value='';
  selectedDay=todayIndex;
  choose(todayIndex);
  document.getElementById('depositTitle').textContent='Edit balance';
  document.getElementById('depositDescription').textContent='Date selection cleared. Select a date on the calendar or enter a day above.';
});
function updateSelectionFromEditor(){
  dateSelectionActive=true;
  document.querySelector('.stage').classList.add('date-selection-active');
  document.querySelector('.deposit-dialog').classList.add('date-selection-active');
  const startValue=rangeStartDateInput.value===''?null:Number(rangeStartDateInput.value);
  const endValue=rangeEndDateInput.value===''?null:Number(rangeEndDateInput.value);
  if(startValue===null&&endValue===null){
    rangeStartIndex=null;rangeEndIndex=null;rangeMode=false;hasUserDateSelection=false;
    renderDateSelection();periodAmountInput.value='';return;
  }
  const effectiveStart=startValue===null?endValue:startValue;
  const effectiveEnd=endValue===null?effectiveStart:endValue;
  if(!Number.isInteger(effectiveStart)||!Number.isInteger(effectiveEnd)||effectiveStart<1||effectiveStart>daysInViewMonth()||effectiveEnd<1||effectiveEnd>daysInViewMonth()) return;
  rangeStartIndex=Math.min(effectiveStart,effectiveEnd)-1;
  rangeEndIndex=Math.max(effectiveStart,effectiveEnd)-1;
  dateSelectionCleared=false;
  rangeMode=rangeStartIndex!==rangeEndIndex;
  hasUserDateSelection=true;
  selectedDay=rangeEndIndex;
  choose(selectedDay);
  periodAmountInput.value='';
  const points=chartPoints();
  depositInput.value=String(points[selectedDay+1].balance);
  document.getElementById('depositTitle').textContent=rangeMode?'Edit period · '+startValue+'–'+endValue+' '+monthLabel():'Edit balance · '+endValue+' '+monthLabel();
}
syncEditorDateFields();
window.addEventListener('resize',()=>choose(selectedDay));

// Outside the date strip, leave date-editing mode and return to today's date.
// Taps on the chart, balance pill, date cards or edit button keep their own behavior.
document.querySelector('.stage').addEventListener('click',event=>{
  if(event.target.closest('.days-window, #editSelectionButton')) return;
  if(depositBackdrop.classList.contains('open')) return;
  const stage=document.querySelector('.stage');
  if(stage.classList.contains('date-selection-active')){
    dateSelectionActive=false;
    stage.classList.remove('date-selection-active');
    rangeStartIndex=null;
    rangeEndIndex=null;
    rangeMode=false;
    hasUserDateSelection=false;
    dateSelectionCleared=false;
    renderDateSelection();
  }
  if(event.target.closest('.chart, #value')) return;
  scrollCalendarToToday(true);
});
</script>
</body>
</html>
