<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="theme-color" content="#022b80">
<title>November 2016</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#022b80}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#f4f7ff;overflow-x:hidden}
.stage{width:min(100vw,1024px);aspect-ratio:2/3;position:relative;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#022b80 0%,#03358f 34%,#0347ad 67%,#086cfa 100%)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 85% 45% at 50% 31%,rgba(0,85,210,.24),transparent 76%),radial-gradient(ellipse 90% 52% at 52% 100%,rgba(0,119,255,.26),transparent 80%);pointer-events:none}
.month{position:absolute;top:0.55%;left:0;width:100%;text-align:center;font-size:clamp(22px,6.25vw,64px);font-weight:300;letter-spacing:.01em;line-height:1.2;white-space:nowrap;color:#f5f5fc}
.chart{position:absolute;left:2.7%;top:12.65%;width:94.6%;height:15.5%;overflow:visible}
.chart svg{width:100%;height:100%;overflow:visible}
.glow{fill:none;stroke:#12eaff;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;opacity:.7;filter:url(#blur)}
.line{fill:none;stroke:#21eaff;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;filter:url(#lineGlow)}
.future{fill:none;stroke:rgba(244,248,255,.94);stroke-width:3;stroke-linecap:round;stroke-dasharray:.1 7.2}
.marker-line{stroke:rgba(242,247,255,.78);stroke-width:1.5}
.marker-halo{fill:#fff;opacity:.42;filter:url(#blur)}
.marker{fill:#fff}
.pill{position:absolute;left:51.85%;top:9.22%;width:15.15%;height:3.15%;min-height:22px;border-radius:7px;background:rgba(184,210,247,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.15vw,32px);font-weight:400;color:#fff;letter-spacing:.01em;z-index:2}
.pill{border:0;cursor:pointer;font-family:inherit;padding:0}
.pill:active{filter:brightness(1.12)}
.deposit-backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,13,49,.62);backdrop-filter:blur(8px)}
.deposit-backdrop.open{display:flex}
.deposit-dialog{width:min(100%,360px);padding:24px;border:1px solid rgba(210,230,255,.2);border-radius:22px;background:linear-gradient(155deg,#174d9d,#07327e);box-shadow:0 18px 60px rgba(0,0,0,.38);color:#f5f8ff}
.deposit-dialog h2{margin:0 0 7px;font-size:21px;font-weight:500}
.deposit-dialog p{margin:0 0 18px;color:rgba(235,244,255,.72);font-size:14px;line-height:1.4}
.deposit-dialog label{display:block;margin-bottom:7px;font-size:13px;color:rgba(235,244,255,.82)}
.deposit-dialog input{width:100%;height:52px;padding:0 14px;border:1px solid rgba(220,237,255,.28);border-radius:12px;outline:none;background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-size:22px;font-weight:500}
.deposit-dialog input:focus{border-color:#59eaff;box-shadow:0 0 0 3px rgba(40,220,255,.14)}
.deposit-actions{display:flex;gap:10px;margin-top:18px}
.deposit-actions button{flex:1;min-height:44px;border:1px solid rgba(230,240,255,.2);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-family:inherit;font-size:15px;font-weight:500}
.deposit-actions .save{border:0;background:linear-gradient(100deg,#13c9ed,#397aff);color:#fff}
.days-window{position:absolute;left:7.32%;top:24.8%;width:89.36%;height:8.25%;overflow-x:auto;overflow-y:visible;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.days-window::-webkit-scrollbar{display:none}
.days{height:100%;display:flex;gap:calc(min(100vw,1024px)*.0127);width:max-content;min-width:100%;padding:0 0 3px}
.day{flex:0 0 calc(min(100vw,1024px)*.1006);width:calc(min(100vw,1024px)*.1006);height:100%;border:1px solid rgba(206,224,255,.09);border-radius:calc(min(100vw,1024px)*.0234);background:linear-gradient(145deg,rgba(255,255,255,.135),rgba(255,255,255,.065));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 7px 19px rgba(0,20,75,.13);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:13px;gap:11px;color:#f5f7ff;cursor:pointer;user-select:none;position:relative;white-space:nowrap}
.day .weekday{font-size:clamp(11px,2.35vw,24px);font-weight:400;line-height:1.1;color:#edf3ff}
.day .date{font-size:clamp(17px,4.05vw,41px);line-height:1.05;font-weight:600;letter-spacing:-.025em}
.day .amount{font-size:clamp(9px,1.65vw,16px);line-height:1;font-weight:500;letter-spacing:.01em;margin-top:-5px;color:rgba(215,244,255,.86);text-shadow:0 0 7px rgba(76,220,255,.16)}
.day .amount.negative{color:rgba(255,190,220,.94);text-shadow:0 0 7px rgba(255,95,189,.18)}
.day.selected .amount{color:#f5fbff;text-shadow:0 0 8px rgba(85,226,255,.3)}
.day.selected .amount.negative{color:#ffd4eb;text-shadow:0 0 8px rgba(255,95,189,.3)}
.day.dim .amount{color:rgba(180,204,239,.34);text-shadow:none}
.day.selected{border:2px solid #ff5fbd;box-shadow:0 0 5px 1px #ff55b9,0 0 15px 2px rgba(255,69,181,.82),inset 0 0 8px rgba(255,89,192,.16);padding-top:12px}
.day.dim,.day.future{background:rgba(255,255,255,.045);border-color:rgba(190,215,255,.035);box-shadow:none}
.day.dim .weekday,.day.dim .date,.day.future .weekday,.day.future .date{color:rgba(180,204,239,.42)}
@media(max-width:600px){.day{border-radius:clamp(9px,2.35vw,24px);padding-top:1.25vw;gap:1.05vw}.day.selected{padding-top:1.1vw}}
</style>
</head>
<body translate="no" class="notranslate">
<main class="stage" aria-label="Monthly earnings dashboard">
  <h1 class="month" id="monthTitle">November 2016</h1>
  <div class="chart">
    <svg viewBox="0 0 960 240" preserveAspectRatio="none" role="img" aria-label="Smooth monthly earnings curve">
      <defs>
        <filter id="blur" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="lineGlow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <path class="glow" d="M0 146 C55 110 68 70 150 70 C230 70 255 150 335 157 C415 165 430 105 500 94 C550 86 570 107 610 95 C675 78 710 38 788 22"/>
      <path class="line" id="activeLine" d="M0 146 C55 110 68 70 150 70 C230 70 255 150 335 157 C415 165 430 105 500 94 C550 86 570 107 610 95 C675 78 710 38 788 22"/>
      <path class="future" d="M788 22 C824 19 836 61 870 58 C900 55 913 75 930 83 C941 88 950 86 960 87"/>
      
      <circle class="marker-halo" cx="580" cy="30" r="19"/>
      <circle class="marker" cx="580" cy="30" r="8.5"/>
    </svg>
  </div>
  <button class="pill" id="value" type="button" aria-label="Edit starting deposit" title="Edit starting deposit">$123</button>
  <div class="days-window" id="daysWindow" aria-label="Scroll dates horizontally">
    <div class="days" id="days"></div>
  </div>
</main>
<div class="deposit-backdrop" id="depositBackdrop" aria-hidden="true">
  <section class="deposit-dialog" role="dialog" aria-modal="true" aria-labelledby="depositTitle">
    <h2 id="depositTitle">Edit balance</h2>
    <p id="depositDescription">Set the deposit balance for the selected day. This day's result and all following balances will recalculate automatically.</p>
    <label for="depositInput">Balance on selected day ($)</label>
    <input id="depositInput" type="number" inputmode="decimal" step="0.01" autocomplete="off">
    <div class="deposit-actions">
      <button type="button" id="cancelDeposit">Cancel</button>
      <button type="button" class="save" id="saveDeposit">Save</button>
    </div>
  </section>
</div>
<script>
const days=document.getElementById('days');
const value=document.getElementById('value');
const depositBackdrop=document.getElementById('depositBackdrop');
const depositInput=document.getElementById('depositInput');
let startingDeposit=200;
try{
  const savedStart=localStorage.getItem('dashboardPlusStartingDeposit');
  if(savedStart!==null&&Number.isFinite(Number(savedStart))) startingDeposit=Number(savedStart);
}catch(error){}
function openDepositEditor(){
  const date=selectedDay+1;
  document.getElementById('depositTitle').textContent='Edit balance · '+date+' November';
  document.getElementById('depositDescription').textContent='Enter the balance you want for this date. The starting deposit and all previous and following balances will be recalculated consistently.';
  const points=chartPoints();
  depositInput.value=String(points[selectedDay+1].balance);
  depositBackdrop.classList.add('open');
  depositBackdrop.setAttribute('aria-hidden','false');
  depositInput.focus();
}
function closeDepositEditor(){
  depositBackdrop.classList.remove('open');
  depositBackdrop.setAttribute('aria-hidden','true');
}
value.addEventListener('click',openDepositEditor);
document.getElementById('cancelDeposit').addEventListener('click',closeDepositEditor);
depositBackdrop.addEventListener('click',event=>{if(event.target===depositBackdrop)closeDepositEditor();});
document.getElementById('saveDeposit').addEventListener('click',()=>{
  const targetBalance=Number(depositInput.value);
  if(!Number.isFinite(targetBalance)){depositInput.focus();return;}
  const exactBalance=Math.round(targetBalance*100)/100;
  const cumulativeChange=amounts.slice(0,selectedDay+1).reduce((sum,amount)=>sum+amount,0);
  startingDeposit=Math.round((exactBalance-cumulativeChange)*100)/100;
  balanceOverrides=Array(30).fill(null);
  try{
    localStorage.setItem('dashboardPlusDailyAmounts',JSON.stringify(amounts));
    localStorage.setItem('dashboardPlusStartingDeposit',String(startingDeposit));
    localStorage.removeItem('dashboardPlusBalanceOverrides');
  }catch(error){}
  closeDepositEditor();
  choose(selectedDay);
});
depositInput.addEventListener('keydown',event=>{
  if(event.key==='Enter')document.getElementById('saveDeposit').click();
  if(event.key==='Escape')closeDepositEditor();
});
const amounts=[15,15,15,15,-105,30,30,30,30,-93,30,-109,30,30,30,30,-95,15,15,15,15,15,15,15,15,15,15,15,15,15];
try{
  const dataVersion='november-2016-daily-amounts-v2';
  const savedVersion=localStorage.getItem('dashboardPlusDailyAmountsVersion');
  if(savedVersion!==dataVersion){
    localStorage.setItem('dashboardPlusDailyAmounts',JSON.stringify(amounts));
    localStorage.setItem('dashboardPlusDailyAmountsVersion',dataVersion);
    localStorage.removeItem('dashboardPlusBalanceOverrides');
  }else{
    const savedAmounts=JSON.parse(localStorage.getItem('dashboardPlusDailyAmounts')||'null');
    if(Array.isArray(savedAmounts)&&savedAmounts.length===30&&savedAmounts.every(n=>Number.isFinite(n))) amounts.splice(0,amounts.length,...savedAmounts);
  }
}catch(error){}
const todayDate=new Date().getDate();
const todayIndex=Math.min(Math.max(todayDate,1),amounts.length)-1;
let selectedDay=todayIndex;
const weekdays=['Tue','Wed','Thu','Fri','Sat','Sun','Mon'];

amounts.forEach((amount,index)=>{
  const date=index+1;
  const btn=document.createElement('button');
  const weekday=document.createElement('span');
  const dateLabel=document.createElement('span');
  const amountLabel=document.createElement('span');
  const dollar=String.fromCharCode(36);
  btn.type='button';
  btn.className='day'+(date>todayDate?' dim':'');
  weekday.className='weekday';
  weekday.textContent=weekdays[index%7];
  dateLabel.className='date';
  dateLabel.textContent=String(date);
  amountLabel.className='amount '+(amount<0?'negative':'positive');
  amountLabel.textContent=(amount<0?'-':'')+dollar+String(Math.abs(amount));
  btn.append(weekday,dateLabel,amountLabel);
  btn.setAttribute('aria-pressed',String(index===todayIndex));
  btn.addEventListener('click',()=>choose(index));
  days.appendChild(btn);
});

let balanceOverrides=Array(30).fill(null);
try{
  const savedOverrides=JSON.parse(localStorage.getItem('dashboardPlusBalanceOverrides')||'null');
  if(Array.isArray(savedOverrides)&&savedOverrides.length===30){
    const anchorIndex=savedOverrides.reduce((last,value,index)=>value!==null?index:last,-1);
    if(anchorIndex>=0){
      const anchorBalance=Number(savedOverrides[anchorIndex]);
      const cumulative=amounts.slice(0,anchorIndex+1).reduce((sum,amount)=>sum+amount,0);
      if(Number.isFinite(anchorBalance)) startingDeposit=Math.round((anchorBalance-cumulative)*100)/100;
      localStorage.setItem('dashboardPlusStartingDeposit',String(startingDeposit));
      localStorage.removeItem('dashboardPlusBalanceOverrides');
    }
  }
}catch(error){}

function chartPoints(){
  const balances=[startingDeposit];
  amounts.forEach((change,index)=>{
    const nextBalance=balances[index]+change;
    balances.push(Math.round(nextBalance*100)/100);
  });
  const min=Math.min(...balances);
  const max=Math.max(...balances);
  const range=max-min||1;
  const visualRange=range*1.22;
  const center=(max+min)/2;
  return balances.map((balance,index)=>({
    x:20+920*index/(balances.length-1),
    y:90-70*(balance-center)/visualRange,
    balance
  }));
}

function curvePath(points,from,to){
  if(from>to) return '';
  if(from===to) return 'M '+points[from].x+' '+points[from].y;
  let d='M '+points[from].x+' '+points[from].y;
  // Centripetal-style cubic handles create a continuous, flowing line through every daily balance.
  for(let i=from;i<to;i++){
    const p0=points[Math.max(from,i-1)];
    const p1=points[i];
    const p2=points[i+1];
    const p3=points[Math.min(to,i+2)];
    const dx=p2.x-p1.x;
    const tension=0.34;
    const c1x=p1.x+dx/3;
    const c2x=p2.x-dx/3;
    const c1y=p1.y+(p2.y-p0.y)*tension;
    const c2y=p2.y-(p3.y-p1.y)*tension;
    d+=' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y;
  }
  return d;
}

function choose(i){
  selectedDay=i;
  [...days.children].forEach((el,n)=>{
    el.classList.toggle('dim',n>todayIndex);
    el.classList.toggle('selected',n===i);
    el.setAttribute('aria-pressed',String(n===i));
  });
  const points=chartPoints();
  const balanceIndex=i+1;
  const point=points[balanceIndex];
  value.textContent=String.fromCharCode(36)+point.balance;
  const activeCurve=curvePath(points,0,balanceIndex);
  document.getElementById('activeLine').setAttribute('d',activeCurve);
  document.querySelector('svg path.glow').setAttribute('d',activeCurve);
  document.querySelector('svg path.future').setAttribute('d',curvePath(points,balanceIndex,points.length-1));
  const marker=document.querySelector('.marker');
  const halo=document.querySelector('.marker-halo');
  marker.setAttribute('cx',point.x);
  marker.setAttribute('cy',point.y);
  halo.setAttribute('cx',point.x);
  halo.setAttribute('cy',point.y);
  // Anchor the balance pill directly above the chart marker.
  const stage=document.querySelector('.stage');
  const chart=document.querySelector('.chart');
  const stageRect=stage.getBoundingClientRect();
  const chartRect=chart.getBoundingClientRect();
  const markerX=chartRect.left-stageRect.left+(point.x/960)*chartRect.width;
  const markerY=chartRect.top-stageRect.top+(point.y/240)*chartRect.height;
  const pillWidth=value.getBoundingClientRect().width;
  const pillHeight=value.getBoundingClientRect().height;
  const pillLeft=Math.max(4,Math.min(stageRect.width-pillWidth-4,markerX-pillWidth/2));
  const pillTop=Math.max(4,markerY-pillHeight-12);
  value.style.left=pillLeft+'px';
  value.style.top=pillTop+'px';
}

const daysWindow=document.getElementById('daysWindow');
const firstDay=days.children[0];
const dayStyle=getComputedStyle(days);
const dayGap=parseFloat(dayStyle.columnGap||dayStyle.gap)||0;
const dayStride=firstDay.getBoundingClientRect().width+dayGap;
// Keep today's card in the same near-right position as the original design.
function scrollCalendarToToday(smooth=true){
  const stride=days.children[0].getBoundingClientRect().width+
    (parseFloat(getComputedStyle(days).columnGap||getComputedStyle(days).gap)||0);
  const target=Math.max(0,todayIndex-6)*stride;
  daysWindow.scrollTo({left:target,behavior:smooth?'smooth':'auto'});
  choose(todayIndex);
}
scrollCalendarToToday(false);
window.addEventListener('resize',()=>choose(selectedDay));

// Tapping the empty dashboard background returns the calendar to today.
// Chart, balance pill and date cards keep their own interactions.
document.querySelector('.stage').addEventListener('click',event=>{
  if(event.target.closest('.chart, #value, .days-window')) return;
  scrollCalendarToToday(true);
});
window.addEventListener('resize',()=>choose(selectedDay));
</script>
</body>
</html>
