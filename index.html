<script>
const days=document.getElementById('days');
const value=document.getElementById('value');
const depositBackdrop=document.getElementById('depositBackdrop');
const depositInput=document.getElementById('depositInput');
const rangeStartDateInput=document.getElementById('rangeStartDate');
const rangeEndDateInput=document.getElementById('rangeEndDate');
const periodAmountInput=document.getElementById('periodAmount');
const clearDateSelectionButton=document.getElementById('clearDateSelection');

function updateVisibleViewport(){
  const viewport=window.visualViewport;
  const height=viewport?viewport.height:window.innerHeight;
  const top=viewport?viewport.offsetTop:0;
  document.documentElement.style.setProperty('--visible-height',height+'px');
  document.documentElement.style.setProperty('--visible-top',top+'px');
}
updateVisibleViewport();
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',updateVisibleViewport);
  window.visualViewport.addEventListener('scroll',updateVisibleViewport);
}
window.addEventListener('resize',updateVisibleViewport);
let startingDeposit=200;
try{
  const savedStart=localStorage.getItem('dashboardPlusStartingDeposit');
  if(savedStart!==null&&Number.isFinite(Number(savedStart))) startingDeposit=Number(savedStart);
}catch(error){}
function openDepositEditor(showDateSelection=false){
  dateSelectionActive=showDateSelection;
  document.querySelector('.deposit-dialog').classList.toggle('date-selection-active',showDateSelection);
  const date=selectedDay+1;
  const start=rangeStartIndex===null?date:Math.min(rangeStartIndex,rangeEndIndex)+1;
  const end=rangeEndIndex===null?date:Math.max(rangeStartIndex,rangeEndIndex)+1;
  document.getElementById('depositTitle').textContent=showDateSelection?(rangeMode?'Edit period · '+start+'–'+end+' '+monthLabel():'Edit date · '+date+' '+monthLabel()):'Edit deposit · '+date+' '+monthLabel();
  document.getElementById('depositDescription').textContent=showDateSelection?(rangeMode?'Enter the daily amount to apply separately to every date in the selected period. The chart and balances will update.':'Enter the amount to apply to this date. The chart and balances will update.'):'Set the balance for this date. Previous and following balances will recalculate automatically.';
  syncEditorDateFields();
  const points=chartPoints();
  depositInput.value=String(points[selectedDay+1].balance);
  depositBackdrop.classList.add('open');
  depositBackdrop.setAttribute('aria-hidden','false');
  updateVisibleViewport();
  (showDateSelection?periodAmountInput:depositInput).focus();
  requestAnimationFrame(()=>{
    updateVisibleViewport();
    const dialog=document.querySelector('.deposit-dialog');
    if(dialog) dialog.scrollTop=0;
  });
  setTimeout(()=>updateVisibleViewport(),250);
  setTimeout(()=>updateVisibleViewport(),500);
}
function closeDepositEditor(){
  depositBackdrop.classList.remove('open');
  depositBackdrop.setAttribute('aria-hidden','true');
}
value.addEventListener('click',()=>openDepositEditor(false));
document.getElementById('editSelectionButton').addEventListener('click',()=>openDepositEditor(true));
document.getElementById('cancelDeposit').addEventListener('click',closeDepositEditor);
depositBackdrop.addEventListener('click',event=>{if(event.target===depositBackdrop)closeDepositEditor();});

document.getElementById('addTransaction').addEventListener('click',()=>{
  const amountInput=document.getElementById('transactionAmount');
  const amount=Math.round(Number(amountInput.value)*100)/100;
  if(!Number.isFinite(amount)||amount<=0){amountInput.focus();return;}
  const type=document.getElementById('transactionType').value;
  const day=Math.max(0,Math.min(amounts.length-1,selectedDay));
  monthTransactions.push({day,type,amount});
  saveMonthTransactions();
  amountInput.value='';
  closeDepositEditor();
  choose(day);
  document.getElementById('transactionHint').textContent=(type==='deposit'?'Top up':'Withdrawal')+' saved for day '+(day+1)+'. The daily amount was not changed.';
});

document.getElementById('saveDeposit').addEventListener('click',()=>{
  if(dateSelectionActive){
    if(periodAmountInput.value.trim()===''){periodAmountInput.focus();return;}
    const targetPeriodTotal=Number(periodAmountInput.value);
    if(!Number.isFinite(targetPeriodTotal)){periodAmountInput.focus();return;}
    if(rangeStartIndex===null||rangeEndIndex===null){periodAmountInput.focus();return;}
    const low=Math.min(rangeStartIndex,rangeEndIndex);
    const high=Math.max(rangeStartIndex,rangeEndIndex);
    const dailyAmount=Math.round(targetPeriodTotal*100)/100;
    for(let i=low;i<=high;i++) amounts[i]=dailyAmount;
    saveMonthData();
    closeDepositEditor();
    choose(selectedDay);
    return;
  }
  const targetBalance=Number(depositInput.value);
  if(!Number.isFinite(targetBalance)){depositInput.focus();return;}
  const exactBalance=Math.round(targetBalance*100)/100;
  const cumulativeChange=amounts.slice(0,selectedDay+1).reduce((sum,amount)=>sum+amount,0);
  const cumulativeTransactions=transactionNetThroughDay(selectedDay);
  startingDeposit=Math.round((exactBalance-cumulativeChange-cumulativeTransactions)*100)/100;
  balanceOverrides=Array(amounts.length).fill(null);
  try{
    saveMonthData();
    localStorage.setItem(monthKey()+'-openingOverride',String(startingDeposit));
    localStorage.setItem('dashboardPlusStartingDeposit',String(startingDeposit));
    localStorage.removeItem('dashboardPlusBalanceOverrides');
  }catch(error){}
  closeDepositEditor();
  choose(selectedDay);
});
depositInput.addEventListener('keydown',event=>{
  if(event.key==='Enter')document.getElementById('saveDeposit').click();
  if(event.key==='Escape')closeDepositEditor();
});
let viewYear=2026;
let viewMonth=10;
const novemberSeed=[15,15,15,15,-105,30,30,30,30,-93,30,-109,30,30,30,30,-95,15,15,15,15,15,15,15,15,15,15,15,15,15];
let amounts=[];
let todayDate=new Date().getDate();
let todayIndex=0;
function monthKey(year=viewYear,month=viewMonth){return 'dashboardPlusDailyAmounts-'+year+'-'+String(month+1).padStart(2,'0');}
function monthLabel(year=viewYear,month=viewMonth){return new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(year,month,1));}
function daysInViewMonth(){return new Date(viewYear,viewMonth+1,0).getDate();}
function isCurrentViewMonth(){const now=new Date();return now.getFullYear()===viewYear&&now.getMonth()===viewMonth;}
function isFutureDate(index){const now=new Date();return new Date(viewYear,viewMonth,index+1)>new Date(now.getFullYear(),now.getMonth(),now.getDate());}
function loadMonthData(){
  const count=daysInViewMonth();
  const key=monthKey();
  try{
    const stored=localStorage.getItem(key);
    const hasUserEdits=localStorage.getItem(key+'-edited')==='1';
    if(stored&&hasUserEdits){
      const parsed=JSON.parse(stored);
      amounts=Array.isArray(parsed)&&parsed.length===count&&parsed.every(n=>Number.isFinite(n))?parsed:Array(count).fill(0);
    }else if(viewYear===2026&&viewMonth===10){
      const legacy=JSON.parse(localStorage.getItem('dashboardPlusDailyAmounts')||'null');
      amounts=Array.isArray(legacy)&&legacy.length===count&&legacy.every(n=>Number.isFinite(n))?legacy:novemberSeed.slice(0,count);
    }else amounts=Array(count).fill(0);
  }catch(error){amounts=(viewYear===2026&&viewMonth===10?novemberSeed.slice(0,count):Array(count).fill(0));}
  todayDate=isCurrentViewMonth()?new Date().getDate():(new Date(viewYear,viewMonth,1)<new Date(new Date().getFullYear(),new Date().getMonth(),1)?count:1);
  todayIndex=Math.max(0,Math.min(count-1,todayDate-1));
  try{localStorage.setItem(key,JSON.stringify(amounts));}catch(error){}
}
let monthTransactions=[];
function loadMonthTransactions(){
  try{const raw=JSON.parse(localStorage.getItem(monthKey()+'-transactions')||'[]');monthTransactions=Array.isArray(raw)?raw.filter(t=>t&&Number.isInteger(t.day)&&t.day>=0&&t.day<amounts.length&&(t.type==='deposit'||t.type==='withdrawal')&&Number.isFinite(t.amount)&&t.amount>0):[];}catch(error){monthTransactions=[];}
}
function saveMonthTransactions(){try{localStorage.setItem(monthKey()+'-transactions',JSON.stringify(monthTransactions));}catch(error){}}
function saveMonthData(){try{localStorage.setItem(monthKey(),JSON.stringify(amounts));localStorage.setItem(monthKey()+'-edited','1');}catch(error){}}
function storedMonthAmounts(year,month){
  const count=new Date(year,month+1,0).getDate();
  const key=monthKey(year,month);
  try{
    const stored=localStorage.getItem(key);
    if(stored&&localStorage.getItem(key+'-edited')==='1'){
      const parsed=JSON.parse(stored);
      if(Array.isArray(parsed)&&parsed.length===count&&parsed.every(Number.isFinite)) return parsed;
    }
    if(year===2026&&month===10){
      const legacy=JSON.parse(localStorage.getItem('dashboardPlusDailyAmounts')||'null');
      if(Array.isArray(legacy)&&legacy.length===count&&legacy.every(Number.isFinite)) return legacy;
      return novemberSeed.slice(0,count);
    }
  }catch(error){}
  return Array(count).fill(0);
}
function monthOpeningBalance(year,month){
  const key=monthKey(year,month)+'-openingOverride';
  try{
    const override=localStorage.getItem(key);
    if(override!==null&&Number.isFinite(Number(override))) return Number(override);
  }catch(error){}
  const firstMonth=new Date(2026,9,1);
  const currentMonth=new Date(year,month,1);
  let baseDeposit=200;
  try{
    const savedBase=localStorage.getItem('dashboardPlusBaseDeposit');
    if(savedBase!==null&&Number.isFinite(Number(savedBase))) baseDeposit=Number(savedBase);
    else{
      const legacyBase=localStorage.getItem('dashboardPlusStartingDeposit');
      if(legacyBase!==null&&Number.isFinite(Number(legacyBase))) baseDeposit=Number(legacyBase);
      localStorage.setItem('dashboardPlusBaseDeposit',String(baseDeposit));
    }
  }catch(error){}
  if(currentMonth<=firstMonth) return baseDeposit;
  const previousMonth=new Date(year,month-1,1);
  const previousOpening=monthOpeningBalance(previousMonth.getFullYear(),previousMonth.getMonth());
  const previousAmounts=storedMonthAmounts(previousMonth.getFullYear(),previousMonth.getMonth());
  let previousTransactions=[];
  try{
    const raw=JSON.parse(localStorage.getItem(monthKey(previousMonth.getFullYear(),previousMonth.getMonth())+'-transactions')||'[]');
    if(Array.isArray(raw))previousTransactions=raw;
  }catch(error){}
  const transactionNet=previousTransactions.reduce((sum,t)=>sum+(t&&Number.isFinite(t.amount)&&t.amount>0?(t.type==='deposit'?t.amount:t.type==='withdrawal'?-t.amount:0):0),0);
  return Math.round((previousOpening+previousAmounts.reduce((sum,amount)=>sum+amount,0)+transactionNet)*100)/100;
}
loadMonthData();
loadMonthTransactions();
startingDeposit=monthOpeningBalance(viewYear,viewMonth);
let selectedDay=todayIndex;
let rangeStartIndex=todayIndex;
let rangeEndIndex=todayIndex;
let rangeMode=false;
let hasUserDateSelection=false;
let dateSelectionCleared=false;
let dateSelectionActive=false;
function transactionSummaryMarkup(day){
  const deposits=monthTransactions.filter(t=>t.day===day&&t.type==='deposit').reduce((sum,t)=>sum+t.amount,0);
  const withdrawals=monthTransactions.filter(t=>t.day===day&&t.type==='withdrawal').reduce((sum,t)=>sum+t.amount,0);
  const fmt=value=>Number(value).toLocaleString('en-US',{maximumFractionDigits:2});
  if(!deposits&&!withdrawals)return '';
  return (deposits?'<span class="calendar-transaction deposit">+'+String.fromCharCode(36)+fmt(deposits)+'</span>':'')+
    (withdrawals?'<span class="calendar-transaction withdrawal">-'+String.fromCharCode(36)+fmt(withdrawals)+'</span>':'');
}
function buildMonthDays(){
  const weekdays=Array.from({length:7},(_,i)=>new Intl.DateTimeFormat('en-US',{weekday:'short'}).format(new Date(viewYear,viewMonth,i+1)));
  amounts.forEach((amount,index)=>{
  const date=index+1;
  const btn=document.createElement('button');
  const weekday=document.createElement('span');
  const dateLabel=document.createElement('span');
  const amountLabel=document.createElement('span');
  const transactionLabel=document.createElement('span');
  const dollar=String.fromCharCode(36);
  btn.type='button';
  btn.className='day'+(isFutureDate(index)?' dim':'');
  weekday.className='weekday';
  weekday.textContent=weekdays[index%7];
  dateLabel.className='date';
  dateLabel.textContent=String(date);
  amountLabel.className='amount '+(amount<0?'negative':'positive');
  amountLabel.textContent=(amount<0?'-':'')+dollar+String(Math.abs(amount));
  transactionLabel.className='transactions';
  transactionLabel.innerHTML=transactionSummaryMarkup(index);
  btn.append(weekday,dateLabel,amountLabel,transactionLabel);
  btn.setAttribute('aria-pressed',String(index===todayIndex));
  let longPressTimer=null;
  let longPressTriggered=false;
  let pointerStart=null;
  btn.addEventListener('pointerdown',event=>{
    if(event.pointerType==='mouse'&&event.button!==0) return;
    longPressTriggered=false;
    pointerStart={x:event.clientX,y:event.clientY};
    clearTimeout(longPressTimer);
    longPressTimer=setTimeout(()=>{
      // Long press starts selection only once. While selecting, the next
      // date (even an earlier one) must complete the range, not replace it.
      if(dateSelectionActive) return;
      longPressTriggered=true;
      dateSelectionActive=true;
      rangeStartIndex=index;
      rangeEndIndex=index;
      rangeMode=false;
      hasUserDateSelection=true;
      dateSelectionCleared=false;
      selectedDay=index;
      choose(index);
      syncEditorDateFields();
      document.querySelector('.stage').classList.add('date-selection-active');
    },550);
  });
  const cancelLongPress=()=>{clearTimeout(longPressTimer);longPressTimer=null;};
  btn.addEventListener('pointerup',cancelLongPress);
  btn.addEventListener('pointercancel',cancelLongPress);
  btn.addEventListener('pointerleave',cancelLongPress);
  btn.addEventListener('pointermove',event=>{
    if(pointerStart&&Math.hypot(event.clientX-pointerStart.x,event.clientY-pointerStart.y)>10) cancelLongPress();
  });
  btn.addEventListener('contextmenu',event=>event.preventDefault());
  btn.addEventListener('click',()=>{
    if(longPressTriggered){longPressTriggered=false;return;}
    if(dateSelectionActive) selectCalendarDate(index);
    else choose(index);
  });
  days.appendChild(btn);
  });
}
buildMonthDays();

let balanceOverrides=Array(amounts.length).fill(null);
try{
  const savedOverrides=JSON.parse(localStorage.getItem('dashboardPlusBalanceOverrides')||'null');
  if(Array.isArray(savedOverrides)&&savedOverrides.length===amounts.length){
    const anchorIndex=savedOverrides.reduce((last,value,index)=>value!==null?index:last,-1);
    if(anchorIndex>=0){
      const anchorBalance=Number(savedOverrides[anchorIndex]);
      const cumulative=amounts.slice(0,anchorIndex+1).reduce((sum,amount)=>sum+amount,0);
      if(Number.isFinite(anchorBalance)) startingDeposit=Math.round((anchorBalance-cumulative)*100)/100;
      localStorage.setItem('dashboardPlusStartingDeposit',String(startingDeposit));
      localStorage.removeItem('dashboardPlusBalanceOverrides');
    }
  }
}catch(error){}

function transactionNetForDay(day){
  return monthTransactions.reduce((sum,t)=>sum+(t.day===day?(t.type==='deposit'?t.amount:-t.amount):0),0);
}
function transactionNetThroughDay(day){
  return monthTransactions.reduce((sum,t)=>sum+(t.day<=day?(t.type==='deposit'?t.amount:-t.amount):0),0);
}
function chartPoints(){
  const balances=[startingDeposit];
  amounts.forEach((change,index)=>{
    const nextBalance=balances[index]+change+transactionNetForDay(index);
    balances.push(Math.round(nextBalance*100)/100);
  });
  const min=Math.min(...balances);
  const max=Math.max(...balances);
  const range=max-min||1;
  const visualRange=range*1.22;
  const center=(max+min)/2;
  return balances.map((balance,index)=>({
    x:20+920*index/(balances.length-1),
    y:90-70*(balance-center)/visualRange,
    balance
  }));
}

function curvePath(points,from,to){
  if(from>to) return '';
  if(from===to) return 'M '+points[from].x+' '+points[from].y;
  let d='M '+points[from].x+' '+points[from].y;
  // Centripetal-style cubic handles create a continuous, flowing line through every daily balance.
  for(let i=from;i<to;i++){
    const p0=points[Math.max(from,i-1)];
    const p1=points[i];
    const p2=points[i+1];
    const p3=points[Math.min(to,i+2)];
    const dx=p2.x-p1.x;
    const tension=0.34;
    const c1x=p1.x+dx/3;
    const c2x=p2.x-dx/3;
    const c1y=p1.y+(p2.y-p0.y)*tension;
    const c2y=p2.y-(p3.y-p1.y)*tension;
    d+=' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+p2.x+' '+p2.y;
  }
  return d;
}

function renderDateSelection(){
  [...days.children].forEach((el,n)=>{
    el.classList.toggle('dim',isFutureDate(n));
    el.classList.remove('selected','range-start','range-end','in-range');
    let pressed=false;
    if(!hasUserDateSelection){
      pressed=!dateSelectionCleared&&n===todayIndex;
      if(pressed) el.classList.add('selected');
    }else if(!rangeMode){
      pressed=n===rangeStartIndex;
      if(pressed) el.classList.add('selected');
    }else{
      const low=Math.min(rangeStartIndex,rangeEndIndex);
      const high=Math.max(rangeStartIndex,rangeEndIndex);
      if(n===rangeStartIndex){el.classList.add('range-start');pressed=true;}
      else if(n===rangeEndIndex){el.classList.add('range-end');pressed=true;}
      else if(n>low&&n<high){el.classList.add('in-range');pressed=true;}
    }
    el.setAttribute('aria-pressed',String(pressed));
  });
}
function periodTotal(){
  if(rangeStartIndex===null||rangeEndIndex===null) return 0;
  const low=Math.min(rangeStartIndex,rangeEndIndex);
  const high=Math.max(rangeStartIndex,rangeEndIndex);
  return amounts.slice(low,high+1).reduce((sum,amount)=>sum+amount,0);
}
function syncEditorDateFields(){
  const first=rangeStartIndex===null?null:Math.min(rangeStartIndex,rangeEndIndex);
  const last=rangeEndIndex===null?null:Math.max(rangeStartIndex,rangeEndIndex);
  rangeStartDateInput.value=first===null?'':String(first+1);
  rangeEndDateInput.value=last===null?'':String(last+1);
  periodAmountInput.value='';
}
function selectCalendarDate(i){
  if(!hasUserDateSelection){
    rangeStartIndex=i;
    rangeEndIndex=i;
    rangeMode=false;
    hasUserDateSelection=true;
    dateSelectionCleared=false;
  }else if(rangeMode){
    rangeStartIndex=i;
    rangeEndIndex=i;
    rangeMode=false;
  }else if(i>rangeStartIndex){
    // A range is created only when the second date is later than the first.
    rangeEndIndex=i;
    rangeMode=true;
  }else if(i<rangeStartIndex){
    // Choosing an earlier date replaces the single selection; it does not
    // create a backwards range.
    rangeStartIndex=i;
    rangeEndIndex=i;
    rangeMode=false;
  }
  choose(i);
  syncEditorDateFields();
  document.querySelector('.stage').classList.add('date-selection-active');
  if(depositBackdrop.classList.contains('open')){
    const points=chartPoints();
    depositInput.value=String(points[selectedDay+1].balance);
    const start=rangeStartIndex+1,end=rangeEndIndex+1;
    document.getElementById('depositTitle').textContent=rangeMode?'Edit period · '+start+'–'+end+' '+monthLabel():'Edit balance · '+(selectedDay+1)+' '+monthLabel();
  }
}
function choose(i){
  selectedDay=i;
  renderDateSelection();
  // Refresh each visible daily amount immediately after in-memory edits.
  [...days.children].forEach((day,index)=>{
    const amount=amounts[index];
    const label=day.querySelector('.amount');
    if(!label) return;
    label.classList.toggle('negative',amount<0);
    label.classList.toggle('positive',amount>=0);
    label.textContent=(amount<0?'-':'')+String.fromCharCode(36)+String(Math.abs(amount));
    const transactionLabel=day.querySelector('.transactions');
    if(transactionLabel)transactionLabel.innerHTML=transactionSummaryMarkup(index);
  });
  const points=chartPoints();
  const negativePoints=document.getElementById('negativePoints');
  negativePoints.innerHTML=amounts.map((amount,index)=>{
    if(amount>=0) return '';
    const end=points[index+1];
    return '<circle class="negative-point-halo" cx="'+end.x+'" cy="'+end.y+'" r="7.5"/>'+
      '<circle class="negative-point" cx="'+end.x+'" cy="'+end.y+'" r="2.8"/>';
  }).join('');
  const transactionLayer=document.getElementById('transactionPoints');
  const transactionCounts={};
  transactionLayer.innerHTML=monthTransactions.map(t=>{
    const p=points[t.day+1];
    const slot=transactionCounts[t.day]||0;
    transactionCounts[t.day]=slot+1;
    const y=Math.max(20,p.y-21-slot*30);
    const symbol=t.type==='deposit'?'+':'-';
    const amountLabel=(t.type==='deposit'?'+':'-')+String.fromCharCode(36)+Number(t.amount).toFixed(2);
    const labelX=p.x>820?-20:20;
    const anchor=p.x>820?'end':'start';
    return '<g class="transaction-point '+t.type+'" transform="translate('+p.x+' '+y+')"><circle class="transaction-halo" r="17"/><circle class="transaction-core" r="13"/><text class="transaction-symbol" y=".5">'+symbol+'</text><text x="'+labelX+'" y="5" text-anchor="'+anchor+'" class="transaction-amount">'+amountLabel+'</text></g>';
  }).join('');
  const balanceIndex=i+1;
  const point=points[balanceIndex];
  // A quiet forecast stays pinned to the final calendar day, independent of selection.
  const forecastPoint=points[points.length-1];
  const forecastMarker=document.getElementById('forecastMarker');
  forecastMarker.setAttribute('cx',forecastPoint.x);
  forecastMarker.setAttribute('cy',forecastPoint.y);
  const forecastValue=document.getElementById('forecastValue');
  forecastValue.textContent='≈ '+String.fromCharCode(36)+forecastPoint.balance;
  const forecastStage=document.querySelector('.stage');
  const forecastChart=document.querySelector('.chart');
  const forecastStageRect=forecastStage.getBoundingClientRect();
  const forecastChartRect=forecastChart.getBoundingClientRect();
  const forecastX=forecastChartRect.left-forecastStageRect.left+(forecastPoint.x/960)*forecastChartRect.width;
  const forecastY=forecastChartRect.top-forecastStageRect.top+(forecastPoint.y/240)*forecastChartRect.height;
  const forecastWidth=forecastValue.getBoundingClientRect().width;
  const forecastHeight=forecastValue.getBoundingClientRect().height;
  const forecastLeft=Math.max(4,Math.min(forecastStageRect.width-forecastWidth-4,forecastX-forecastWidth/2));
  const forecastAbove=Math.max(4,forecastY-forecastHeight-10);
  const forecastBelow=Math.max(4,Math.min(forecastStageRect.height-forecastHeight-4,forecastY+12));
  const depositLeft=parseFloat(value.style.left)||0;
  const depositTop=parseFloat(value.style.top)||0;
  const depositWidth=value.getBoundingClientRect().width;
  const depositHeight=value.getBoundingClientRect().height;
  const overlapsDeposit=(left,top)=>left<depositLeft+depositWidth+10&&left+forecastWidth+10>depositLeft&&top<depositTop+depositHeight+8&&top+forecastHeight+8>depositTop;
  const candidates=[
    [forecastLeft,forecastAbove],
    [forecastLeft,forecastBelow],
    [Math.max(4,forecastLeft-forecastWidth*.7),forecastAbove],
    [Math.max(4,forecastLeft-forecastWidth*.7),forecastBelow],
    [Math.min(forecastStageRect.width-forecastWidth-4,forecastLeft+forecastWidth*.7),forecastAbove],
    [Math.min(forecastStageRect.width-forecastWidth-4,forecastLeft+forecastWidth*.7),forecastBelow]
  ];
  const forecastPosition=candidates.find(([left,top])=>!overlapsDeposit(left,top))||[forecastLeft,forecastBelow];
  forecastValue.style.left=forecastPosition[0]+'px';
  forecastValue.style.top=forecastPosition[1]+'px';
  value.textContent=String.fromCharCode(36)+point.balance;
  const activeCurve=curvePath(points,0,balanceIndex);
  document.getElementById('activeLine').setAttribute('d',activeCurve);
  document.querySelector('svg path.glow').setAttribute('d',activeCurve);
  document.querySelector('svg path.future').setAttribute('d',points.slice(balanceIndex).map((p,index)=>(index===0?'M ':'L ')+p.x+' '+p.y).join(' '));
  const marker=document.querySelector('.marker');
  const halo=document.querySelector('.marker-halo');
  marker.setAttribute('cx',point.x);
  marker.setAttribute('cy',point.y);
  halo.setAttribute('cx',point.x);
  halo.setAttribute('cy',point.y);
  // Anchor the balance pill directly above the chart marker.
  const stage=document.querySelector('.stage');
  const chart=document.querySelector('.chart');
  const stageRect=stage.getBoundingClientRect();
  const chartRect=chart.getBoundingClientRect();
  const markerX=chartRect.left-stageRect.left+(point.x/960)*chartRect.width;
  const markerY=chartRect.top-stageRect.top+(point.y/240)*chartRect.height;
  const pillWidth=value.getBoundingClientRect().width;
  const pillHeight=value.getBoundingClientRect().height;
  const pillLeft=Math.max(4,Math.min(stageRect.width-pillWidth-4,markerX-pillWidth/2));
  const pillTop=Math.max(4,markerY-pillHeight-12);
  value.style.left=pillLeft+'px';
  value.style.top=pillTop+'px';

  // Reposition the forecast only after the deposit pill has its final
  // coordinates for this render (the earlier layout pass can be stale).
  const depositBox={left:pillLeft,top:pillTop,width:pillWidth,height:pillHeight};
  const forecastBoxWidth=forecastValue.getBoundingClientRect().width;
  const forecastBoxHeight=forecastValue.getBoundingClientRect().height;
  const forecastCenterX=forecastX;
  const forecastCandidates=[
    [Math.max(4,Math.min(stageRect.width-forecastBoxWidth-4,forecastCenterX-forecastBoxWidth/2)),Math.min(stageRect.height-forecastBoxHeight-4,forecastY+14)],
    [Math.max(4,Math.min(stageRect.width-forecastBoxWidth-4,forecastCenterX-forecastBoxWidth/2)),Math.max(4,forecastY-forecastBoxHeight-14)],
    [Math.max(4,Math.min(stageRect.width-forecastBoxWidth-4,depositBox.left-forecastBoxWidth-12)),Math.max(4,Math.min(stageRect.height-forecastBoxHeight-4,forecastY-forecastBoxHeight/2))],
    [Math.max(4,Math.min(stageRect.width-forecastBoxWidth-4,depositBox.left+depositBox.width+12)),Math.max(4,Math.min(stageRect.height-forecastBoxHeight-4,forecastY-forecastBoxHeight/2))]
  ];
  const forecastAvoidsDeposit=([left,top])=>
    left+forecastBoxWidth+8<=depositBox.left ||
    left>=depositBox.left+depositBox.width+8 ||
    top+forecastBoxHeight+8<=depositBox.top ||
    top>=depositBox.top+depositBox.height+8;
  const finalForecastPosition=forecastCandidates.find(forecastAvoidsDeposit)||forecastCandidates[0];
  forecastValue.style.left=finalForecastPosition[0]+'px';
  forecastValue.style.top=finalForecastPosition[1]+'px';
}

const daysWindow=document.getElementById('daysWindow');
const firstDay=days.children[0];
const dayStyle=getComputedStyle(days);
const dayGap=parseFloat(dayStyle.columnGap||dayStyle.gap)||0;
const dayStride=firstDay.getBoundingClientRect().width+dayGap;
// Keep today's card in the same near-right position as the original design.
function scrollCalendarToToday(smooth=true){
  const stride=days.children[0].getBoundingClientRect().width+
    (parseFloat(getComputedStyle(days).columnGap||getComputedStyle(days).gap)||0);
  const target=Math.max(0,todayIndex-6)*stride;
  daysWindow.scrollTo({left:target,behavior:smooth?'smooth':'auto'});
  choose(todayIndex);
}
scrollCalendarToToday(false);
const earliestCalendarMonth=new Date(2026,9,1);
function changeMonth(offset){
  if(depositBackdrop.classList.contains('open')) return;
  const nextMonthDate=new Date(viewYear,viewMonth+offset,1);
  if(nextMonthDate<earliestCalendarMonth) return;
  viewYear=nextMonthDate.getFullYear();
  viewMonth=nextMonthDate.getMonth();
  loadMonthData();
  loadMonthTransactions();
  startingDeposit=monthOpeningBalance(viewYear,viewMonth);
  selectedDay=todayIndex;
  rangeStartIndex=todayIndex;rangeEndIndex=todayIndex;
  rangeMode=false;hasUserDateSelection=false;dateSelectionCleared=false;dateSelectionActive=false;
  document.querySelector('.stage').classList.remove('date-selection-active');
  days.innerHTML='';
  document.getElementById('monthTitle').textContent=monthLabel();
  const previousMonthButton=document.getElementById('previousMonth');
  previousMonthButton.disabled=(viewYear===2026&&viewMonth===9);
  previousMonthButton.setAttribute('aria-disabled',String(previousMonthButton.disabled));
  buildMonthDays();
  syncEditorDateFields();
  scrollCalendarToToday(false);
}
document.getElementById('previousMonth').addEventListener('click',()=>changeMonth(-1));
document.getElementById('nextMonth').addEventListener('click',()=>changeMonth(1));
// Horizontal swipe anywhere on the dashboard (except the date strip) changes month.
let monthSwipeStart=null;
const stageForSwipe=document.querySelector('.stage');
stageForSwipe.addEventListener('touchstart',event=>{
  if(depositBackdrop.classList.contains('open')||event.target.closest('.days-window,.edit-selection-button,.month-arrow')){monthSwipeStart=null;return;}
  const touch=event.changedTouches[0];monthSwipeStart={x:touch.clientX,y:touch.clientY};
},{passive:true});
stageForSwipe.addEventListener('touchend',event=>{
  if(!monthSwipeStart)return;
  const touch=event.changedTouches[0],dx=touch.clientX-monthSwipeStart.x,dy=touch.clientY-monthSwipeStart.y;
  monthSwipeStart=null;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25) changeMonth(dx>0?-1:1);
},{passive:true});
let mouseSwipeStart=null;
stageForSwipe.addEventListener('pointerdown',event=>{
  if(event.pointerType!=='mouse'||event.target.closest('.days-window,.edit-selection-button,.month-arrow'))return;
  mouseSwipeStart={x:event.clientX,y:event.clientY};
});
stageForSwipe.addEventListener('pointerup',event=>{
  if(!mouseSwipeStart)return;
  const dx=event.clientX-mouseSwipeStart.x,dy=event.clientY-mouseSwipeStart.y;mouseSwipeStart=null;
  if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)changeMonth(dx>0?-1:1);
});

rangeStartDateInput.addEventListener('input',updateSelectionFromEditor);
rangeEndDateInput.addEventListener('input',updateSelectionFromEditor);
clearDateSelectionButton.addEventListener('click',()=>{
  dateSelectionActive=false;
  document.querySelector('.stage').classList.remove('date-selection-active');
  document.querySelector('.deposit-dialog').classList.remove('date-selection-active');
  rangeStartIndex=null;
  rangeEndIndex=null;
  rangeMode=false;
  hasUserDateSelection=false;
  dateSelectionCleared=true;
  renderDateSelection();
  rangeStartDateInput.value='';
  rangeEndDateInput.value='';
  periodAmountInput.value='';
  selectedDay=todayIndex;
  choose(todayIndex);
  document.getElementById('depositTitle').textContent='Edit balance';
  document.getElementById('depositDescription').textContent='Date selection cleared. Select a date on the calendar or enter a day above.';
});
function updateSelectionFromEditor(){
  dateSelectionActive=true;
  document.querySelector('.stage').classList.add('date-selection-active');
  document.querySelector('.deposit-dialog').classList.add('date-selection-active');
  const startValue=rangeStartDateInput.value===''?null:Number(rangeStartDateInput.value);
  const endValue=rangeEndDateInput.value===''?null:Number(rangeEndDateInput.value);
  if(startValue===null&&endValue===null){
    rangeStartIndex=null;rangeEndIndex=null;rangeMode=false;hasUserDateSelection=false;
    renderDateSelection();periodAmountInput.value='';return;
  }
  const effectiveStart=startValue===null?endValue:startValue;
  const effectiveEnd=endValue===null?effectiveStart:endValue;
  if(!Number.isInteger(effectiveStart)||!Number.isInteger(effectiveEnd)||effectiveStart<1||effectiveStart>daysInViewMonth()||effectiveEnd<1||effectiveEnd>daysInViewMonth()) return;
  rangeStartIndex=Math.min(effectiveStart,effectiveEnd)-1;
  rangeEndIndex=Math.max(effectiveStart,effectiveEnd)-1;
  dateSelectionCleared=false;
  rangeMode=rangeStartIndex!==rangeEndIndex;
  hasUserDateSelection=true;
  selectedDay=rangeEndIndex;
  choose(selectedDay);
  periodAmountInput.value='';
  const points=chartPoints();
  depositInput.value=String(points[selectedDay+1].balance);
  document.getElementById('depositTitle').textContent=rangeMode?'Edit period · '+startValue+'–'+endValue+' '+monthLabel():'Edit balance · '+endValue+' '+monthLabel();
}
syncEditorDateFields();
window.addEventListener('resize',()=>choose(selectedDay));

// Outside the date strip, leave date-editing mode and return to today's date.
// Taps on the chart, balance pill, date cards or edit button keep their own behavior.
document.querySelector('.stage').addEventListener('click',event=>{
  if(event.target.closest('.days-window, #editSelectionButton')) return;
  if(depositBackdrop.classList.contains('open')) return;
  const stage=document.querySelector('.stage');
  if(stage.classList.contains('date-selection-active')){
    dateSelectionActive=false;
    stage.classList.remove('date-selection-active');
    rangeStartIndex=null;
    rangeEndIndex=null;
    rangeMode=false;
    hasUserDateSelection=false;
    dateSelectionCleared=false;
    renderDateSelection();
  }
  if(event.target.closest('.chart, #value')) return;
  scrollCalendarToToday(true);
});
</script>
